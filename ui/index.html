<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div class="app">
      <!-- Every control that applies in the current mode, in one row; nothing folds away, so the
           editor's minimum width is the widest row's. Only the wordmark hides when it is narrow. -->
      <header class="toolbar" id="toolbar">
        <div class="brand">
          <span class="brand-mark" id="brand-mark" aria-hidden="true"></span>
          <span class="wordmark" id="wordmark"></span>
        </div>
        <div class="segmented" id="display-mode" data-help="displayMode"></div>
        <!-- Each field that opens a popover holds it, so the popover follows its button in the
             focus order and shares its help. -->
        <div class="tool" id="group-group" data-help="group">
          <button
            class="field-button"
            id="group-details"
            aria-expanded="false"
            aria-controls="group-popover"
          >
            <i>Group</i><b id="group-summary">A</b
            ><svg class="chevron" viewBox="0 0 8 8" aria-hidden="true">
              <path d="M1.5 3 4 5.5 6.5 3" />
            </svg>
          </button>
          <div class="popover" id="group-popover" hidden>
            <div class="popover-title">Group</div>
            <div class="segmented" id="group"></div>
          </div>
        </div>
        <span class="divider"></span>
        <div class="segmented" id="time-base" data-help="timeBase"></div>
        <div class="tool icon-field" id="time-group" data-help="timeSpan">
          <svg class="icon" viewBox="0 0 12 12" aria-hidden="true">
            <path
              d="M1 3v6M11 3v6M2.5 6h7M4 4.5 2.5 6 4 7.5M8 4.5 9.5 6 8 7.5"
            />
          </svg>
          <div id="span-field" data-help="timeSpan"></div>
          <div id="beat-span-field" data-help="beatSpan" hidden></div>
        </div>
        <div
          class="tool icon-field"
          id="vertical-group"
          data-help="verticalScale"
        >
          <svg class="icon" viewBox="0 0 12 12" aria-hidden="true">
            <path
              d="M3 1h6M3 11h6M6 2.5v7M4.5 4 6 2.5 7.5 4M4.5 8 6 9.5 7.5 8"
            />
          </svg>
          <div id="scale-field" data-help="verticalScale"></div>
        </div>
        <span class="divider"></span>
        <div class="tool" id="views-group" data-help="channelViews">
          <button
            class="field-button"
            id="views-details"
            aria-expanded="false"
            aria-controls="views-popover"
          >
            <svg class="icon" viewBox="0 0 12 12" aria-hidden="true">
              <path
                d="M1 3.5c1.2-2 2.3-2 3.5 0s2.3 2 3.5 0 2.3-2 3 0M1 9c1.2-2 2.3-2 3.5 0s2.3 2 3.5 0 2.3-2 3 0"
              /></svg
            ><b id="views-summary"></b
            ><svg class="chevron" viewBox="0 0 8 8" aria-hidden="true">
              <path d="M1.5 3 4 5.5 6.5 3" />
            </svg>
          </button>
          <div class="popover" id="views-popover" hidden>
            <div class="popover-title">Views</div>
            <div class="popover-row">
              <span>Channels</span>
              <div class="segmented toggles" id="views"></div>
            </div>
          </div>
        </div>
        <div class="segmented" id="layout" data-help="layout"></div>
        <span class="divider" id="trigger-divider"></span>
        <div class="tool" id="trigger-group" data-help="trigger">
          <button
            class="field-button"
            id="trigger-details"
            aria-expanded="false"
            aria-controls="trigger-popover"
          >
            <svg class="icon" viewBox="0 0 12 12" aria-hidden="true">
              <path d="M1 10h3.5L7.5 2H11" />
              <path class="dashed" d="M1 6h10" /></svg
            ><b id="trigger-summary"></b
            ><svg class="chevron" viewBox="0 0 8 8" aria-hidden="true">
              <path d="M1.5 3 4 5.5 6.5 3" />
            </svg>
          </button>
          <div class="popover" id="trigger-popover" hidden>
            <div class="popover-title">Trigger</div>
            <div class="popover-row">
              <span>Mode</span>
              <div class="segmented" id="mode"></div>
            </div>
            <div class="popover-row" id="source-row" data-help="triggerSource">
              <span>Source</span>
              <div class="segmented" id="source"></div>
            </div>
            <div class="popover-row" data-help="triggerSlope">
              <span>Slope</span>
              <div class="segmented" id="slope"></div>
            </div>
            <div class="popover-row" data-help="triggerLevel">
              <span>Level</span>
              <div id="level-field"></div>
            </div>
            <div class="popover-row" data-help="triggerHysteresis">
              <span>Hysteresis</span>
              <div id="hysteresis-field"></div>
            </div>
            <div class="popover-row" data-help="triggerHoldOff">
              <span>Hold-off</span>
              <div id="hold-off-field"></div>
            </div>
          </div>
        </div>
        <button class="action" id="arm" data-help="rearm" hidden>Re-arm</button>
        <span class="spacer"></span>
        <button
          class="action freeze"
          id="freeze"
          aria-pressed="false"
          data-help="freeze"
        >
          Freeze
        </button>
        <button
          class="action"
          id="auto-freeze"
          aria-pressed="false"
          data-help="autoFreeze"
        >
          Auto-freeze
        </button>
      </header>
      <main class="screen" id="screen" data-help="screen">
        <canvas class="grid" id="grid"></canvas>
        <canvas class="trace" id="trace"></canvas>
        <div class="labels" id="labels"></div>
        <div class="lane-labels" id="lane-labels"></div>
        <div class="selection" id="selection" hidden></div>
        <div class="trigger-line" id="trigger-line"></div>
        <div class="time-cursor" id="cursor-a" data-help="timeCursor" hidden>
          <span>A</span>
        </div>
        <div class="time-cursor" id="cursor-b" data-help="timeCursor" hidden>
          <span>B</span>
        </div>
        <div class="level-cursor-lines" id="level-cursor-lines"></div>
        <div class="hover-cycle" id="hover-cycle" hidden></div>
        <div class="hover-line" id="hover-line" hidden></div>
        <div class="hover-readout" id="hover-readout" hidden></div>
        <div class="screen-corner">
          <div class="cursor-readout" id="cursor-readout" hidden></div>
        </div>
        <div
          class="trigger-marker"
          id="trigger-marker"
          data-help="triggerMarker"
        ></div>
        <div class="message" id="message" hidden>
          <strong id="message-title"></strong>
          <span id="message-text"></span>
        </div>
      </main>
      <!-- Left: the cursor buttons and concert pitch, which never change width. Centre: the
           readouts, labelled with what they measure. Right: the state, in a fixed width, and
           Help. Nothing here moves when the state or a value changes. -->
      <footer class="statusbar">
        <div class="status-left">
          <button
            class="action"
            id="time-cursors"
            aria-pressed="false"
            data-help="timeCursors"
          >
            Time
          </button>
          <button
            class="action"
            id="level-cursors"
            aria-pressed="false"
            data-help="levelCursors"
          >
            Level
          </button>
          <button
            class="action"
            id="hover-toggle"
            aria-pressed="false"
            data-help="hoverReadout"
          >
            Hover
          </button>
          <span class="divider"></span>
          <div class="tool icon-field" data-help="concertPitch">
            <i>A4</i>
            <div id="concert-pitch-field"></div>
          </div>
        </div>
        <div class="readouts">
          <span
            class="readout-tag"
            id="readout-tag"
            data-help="readoutSource"
          ></span>
          <div class="readout" data-help="peak">
            <b>Peak</b><span id="peak">—</span><small>dBFS</small>
          </div>
          <div class="readout" data-help="rms">
            <b>RMS</b><span id="rms">—</span><small>dBFS</small>
          </div>
          <div class="readout" data-help="frequency">
            <b>Freq</b><span id="frequency">—</span><small>Hz</small>
          </div>
        </div>
        <div class="status-right">
          <div class="chips" id="chips" data-help="status"></div>
          <button
            class="help-toggle"
            id="help"
            aria-pressed="false"
            aria-label="Help"
            data-help="help"
          >
            ?
          </button>
        </div>
      </footer>
    </div>
    <div
      class="resize-grip"
      id="resize-grip"
      data-help="resizeGrip"
      aria-hidden="true"
    ></div>
    <div class="help-tip" id="help-tip" role="tooltip" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
