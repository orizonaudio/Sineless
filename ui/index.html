<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>O-Scope</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <div class="wordmark">O-Scope <span>· Orizon</span></div>
        <div
          class="segmented bar-switch"
          id="display-mode"
          data-help="displayMode"
        ></div>
        <div class="segmented bar-switch" id="group" data-help="group"></div>
        <div class="chips" id="chips" data-help="status"></div>
        <div class="readouts">
          <div class="readout" data-help="peak">
            <b>Peak</b><span id="peak">—</span><small>dBFS</small>
          </div>
          <div class="readout" data-help="rms">
            <b>RMS</b><span id="rms">—</span><small>dBFS</small>
          </div>
          <div class="readout" data-help="frequency">
            <b>Freq</b><span id="frequency">—</span><small>Hz</small>
          </div>
        </div>
        <button
          class="help-toggle"
          id="help"
          aria-pressed="false"
          aria-label="Help"
          data-help="help"
        >
          ?
        </button>
      </header>
      <main class="screen" id="screen" data-help="screen">
        <canvas class="grid" id="grid"></canvas>
        <canvas class="trace" id="trace"></canvas>
        <div class="sweep-previous" id="sweep-previous" hidden></div>
        <div class="sweep-cursor" id="sweep-cursor" hidden></div>
        <div class="labels" id="labels"></div>
        <div class="lane-labels" id="lane-labels"></div>
        <div class="selection" id="selection" hidden></div>
        <div class="trigger-line" id="trigger-line"></div>
        <div class="time-cursor" id="cursor-a" data-help="timeCursor" hidden>
          <span>A</span>
        </div>
        <div class="time-cursor" id="cursor-b" data-help="timeCursor" hidden>
          <span>B</span>
        </div>
        <div class="level-cursor-lines" id="level-cursor-lines"></div>
        <div class="cursor-readout" id="cursor-readout" hidden></div>
        <div
          class="trigger-marker"
          id="trigger-marker"
          data-help="triggerMarker"
        ></div>
        <div class="message" id="message" hidden>
          <strong id="message-title"></strong>
          <span id="message-text"></span>
        </div>
      </main>
      <footer class="controls">
        <section class="group" id="time-group">
          <div class="group-label">Time</div>
          <div class="row">
            <div id="span-field" data-help="timeSpan"></div>
            <div id="beat-span-field" data-help="beatSpan" hidden></div>
          </div>
          <div class="segmented" id="time-base" data-help="timeBase"></div>
        </section>
        <section class="group" id="vertical-group">
          <div class="group-label">Vertical</div>
          <div id="scale-field" data-help="verticalScale"></div>
        </section>
        <section class="group" id="views-group">
          <div class="group-label">Views</div>
          <div class="row" id="views" data-help="channelViews"></div>
          <div class="segmented" id="layout" data-help="layout"></div>
        </section>
        <section class="group" id="trigger-group" data-help="trigger">
          <button
            class="group-label group-button"
            id="trigger-details"
            aria-expanded="false"
          >
            Trigger <span id="trigger-summary"></span>
          </button>
          <div class="segmented" id="mode"></div>
          <div class="row" id="arm-row">
            <button class="action" id="arm" data-help="rearm" disabled>
              Re-arm
            </button>
          </div>
        </section>
        <section class="group push" id="display-group">
          <div class="group-label">Display</div>
          <div class="row">
            <button
              class="action"
              id="freeze"
              aria-pressed="false"
              data-help="freeze"
            >
              Freeze
            </button>
            <button
              class="action"
              id="auto-freeze"
              aria-pressed="false"
              data-help="autoFreeze"
            >
              Auto-freeze
            </button>
          </div>
          <div class="row">
            <button
              class="action"
              id="time-cursors"
              aria-pressed="false"
              data-help="timeCursors"
            >
              Time
            </button>
            <button
              class="action"
              id="level-cursors"
              aria-pressed="false"
              data-help="levelCursors"
            >
              Level
            </button>
          </div>
        </section>
        <div class="popover" id="trigger-popover" hidden>
          <div class="popover-row" data-help="triggerSource">
            <span>Source</span>
            <div class="segmented" id="source"></div>
          </div>
          <div class="popover-row" data-help="triggerSlope">
            <span>Slope</span>
            <div class="segmented" id="slope"></div>
          </div>
          <div class="popover-row" data-help="triggerLevel">
            <span>Level</span>
            <div id="level-field"></div>
          </div>
          <div class="popover-row" data-help="triggerHysteresis">
            <span>Hysteresis</span>
            <div id="hysteresis-field"></div>
          </div>
          <div class="popover-row" data-help="triggerHoldOff">
            <span>Hold-off</span>
            <div id="hold-off-field"></div>
          </div>
        </div>
      </footer>
    </div>
    <div class="help-tip" id="help-tip" role="tooltip" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
