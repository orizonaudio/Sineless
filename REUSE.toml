# Every file's copyright and licence, in the REUSE format (https://reuse.software), checked by CI's
# reuse job. When several annotations match a file, the last one wins.
# The README's Licence section states the additional permission under GPLv3 section 7 for
# ui/src/brand/, and TRADEMARKS.md what the GPL doesn't cover.
version = 1

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Bruno Lima, trading as Orizon Audio"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = ["ui/src/fonts/Geist.woff2", "ui/src/fonts/GeistMono.woff2", "ui/src/fonts/OFL-Geist.txt"]
SPDX-FileCopyrightText = "2024 The Geist Project Authors (https://github.com/vercel/geist-font)"
SPDX-License-Identifier = "OFL-1.1"

# The logo: not under the GPL. Last, so that it wins over the catch-all above.
[[annotations]]
path = "ui/src/brand/*.svg"
SPDX-FileCopyrightText = "2026 Bruno Lima, trading as Orizon Audio"
SPDX-License-Identifier = "LicenseRef-Orizon-Brand"
