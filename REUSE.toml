# Every file's copyright and licence, in the REUSE format (https://reuse.software), checked by CI's
# reuse job. When several annotations match a file, the last one wins.
# The README's Licence section states the additional permission under GPLv3 section 7 for
# ui/src/brand/, and TRADEMARKS.md what the GPL doesn't cover.
version = 1

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 Bruno Lima, trading as Orizon Audio"
SPDX-License-Identifier = "GPL-3.0-only"

[[annotations]]
path = ["ui/src/fonts/Roboto.woff2", "ui/src/fonts/RobotoCondensed.woff2", "ui/src/fonts/OFL-Roboto.txt"]
SPDX-FileCopyrightText = "2011 The Roboto Project Authors (https://github.com/googlefonts/roboto-classic)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["ui/src/fonts/RobotoMono.woff2", "ui/src/fonts/OFL-RobotoMono.txt"]
SPDX-FileCopyrightText = "2015 The Roboto Mono Project Authors (https://github.com/googlefonts/robotomono)"
SPDX-License-Identifier = "OFL-1.1"
