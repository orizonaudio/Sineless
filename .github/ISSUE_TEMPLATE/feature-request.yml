name: Feature request
description: Something Sineless could do that it does not do yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation and what gets in the way, rather than the feature itself.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
