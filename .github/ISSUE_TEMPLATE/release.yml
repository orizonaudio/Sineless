name: Release
description: The steps of a release, from the version change to publishing, each ticked or answered.
title: "Release x.y.z"
labels: [release]
body:
  - type: markdown
    attributes:
      value: >-
        One issue per release, opened when the version changes and closed once it is published.
        The steps are in "Releasing" in
        [CONTRIBUTING.md](https://github.com/orizonaudio/Sineless/blob/main/CONTRIBUTING.md#releasing)
        and the smoke test and protocol in
        [HOSTS.md](https://github.com/orizonaudio/Sineless/blob/main/HOSTS.md). A step
        left unticked says why in a comment before the draft is published.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: x.y.z
    validations:
      required: true
  - type: checkboxes
    id: before-tag
    attributes:
      label: Before the tag
      options:
        - label: The version is set in CMakeLists.txt and the issue templates' placeholders.
        - label: scripts/check.sh passes.
        - label: scripts/soak.sh passes (scripts/soak.sh 60 after a change to something long-lived).
        - label: The version change is merged and the tag pushed; the release workflow made the draft.
  - type: checkboxes
    id: downloads
    attributes:
      label: The draft's downloads
      options:
        - label: Every download matches SHA256SUMS.txt and its attestation.
        - label: The macOS installer, opened as downloaded, installs the VST3 plugin and the Audio Unit without a password and leaves no quarantine flag.
        - label: The installed Audio Unit passes `auval -strict -v aufx Snls Oriz`.
        - label: The Windows installer, run as downloaded, installs and uninstalls from Settings > Apps.
  - type: checkboxes
    id: smoke
    attributes:
      label: Smoke test (HOSTS.md), in the draft's downloads
      options:
        - label: Ableton Live on macOS.
        - label: Logic Pro or GarageBand, if the release changes anything that builds into the Audio Unit or its package (au/, editor/src/mac/, cmake/AudioUnitVersion.cmake, cmake/Branding.cmake, scripts/package.sh, scripts/validate-au.sh).
        - label: A Windows host, if the release changes any Windows-only code or build setting (editor/src/win/, _WIN32 branches, Windows conditions in the CMake files, scripts/package.ps1, scripts/installer.iss, scripts/windows-env.ps1).
  - type: checkboxes
    id: protocol
    attributes:
      label: Full protocol (HOSTS.md), when due
      description: >-
        Due before a release that changes what Sineless takes from hosts (the transport, tempo,
        track details, state, the editor's sizing) or its memory (the sweeps, capture buffers),
        after a tested host's major update, and at least once a quarter in Live on macOS and on
        Windows, with the scripted REAPER test on Windows. Say in a comment where it ran, or why
        it is not due.
      options:
        - label: The full protocol ran where due, or is not due.
  - type: checkboxes
    id: publish
    attributes:
      label: Publishing
      options:
        - label: HOSTS.md records each host tested and which test ran.
        - label: The draft is published.
