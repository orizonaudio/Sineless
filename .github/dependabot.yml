# Weekly update pull requests for the npm packages and the GitHub Actions (which CI pins to
# commits). The C++ dependencies are fetched by CMake at pinned versions; Dependabot cannot see
# them, so cmake/Dependencies.cmake is updated by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch updates together; a major one comes on its own, as it may need changes.
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  # Mutation testing's own packages: Stryker and the Vitest it runs, held at 4 until Stryker's
  # Vitest runner supports Vitest 5 (stryker-js#6210, #6240).
  - package-ecosystem: npm
    directory: /tools/mutation
    schedule:
      interval: weekly
    groups:
      mutation:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
