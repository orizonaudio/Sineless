# Weekly update pull requests for the npm packages, the GitHub Actions (which CI pins to commits)
# and the mutation testing image's base (pinned by digest). The C++ dependencies are fetched by
# CMake at pinned versions; Dependabot cannot see them, so cmake/Dependencies.cmake is updated by
# hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Minor and patch updates together; a major one comes on its own, as it may need changes.
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Node's types follow the Node the project runs (.nvmrc, "engines" in package.json): a newer
    # major describes functions that Node 22 lacks. Both move together, by hand.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  # Mutation testing's own packages: Stryker and the Vitest it runs, held at 4 until Stryker's
  # Vitest runner supports Vitest 5 (stryker-js#6210, #6240).
  - package-ecosystem: npm
    directory: /tools/mutation
    schedule:
      interval: weekly
    groups:
      mutation:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The mutation testing image's base: new digests of Ubuntu 24.04 only. Its Mull package is built
  # for 24.04 and LLVM 18 (tools/mutation/install-mull.sh), and CI never builds this image, so a
  # newer release would pass CI and break the mutation run on macOS; that move is made by hand.
  - package-ecosystem: docker
    directory: /tools/mutation
    schedule:
      interval: weekly
    ignore:
      - dependency-name: ubuntu
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
