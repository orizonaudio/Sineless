name: Fuzz nightly

# Half an hour of fuzzing a night from the corpus kept on main, which it then prunes to the
# fewest inputs that reach the same code and keeps for the next runs: pull requests' fuzz jobs
# start from it (ci.yml), and running nightly keeps the cache from expiring (GitHub drops one
# unused for seven days). A crash or a failed invariant fails the run, which GitHub reports to
# the repository's owner, and keeps the input as an artifact.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}

jobs:
  fuzz:
    name: fuzz-nightly
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: fuzz
      - run: cmake --preset fuzz -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build --preset fuzz
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - run: scripts/fuzz.sh 1800
      - run: scripts/fuzz.sh --prune
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: build/fuzz/artifacts/
          if-no-files-found: ignore
