name: Release

# Pushing a tag vX.Y.Z builds the release zips on GitHub's runners and creates a draft release
# for them, with notes generated from the merged pull requests, a SHA-256 checksum of each zip
# and a build provenance attestation (`gh attestation verify <zip> --repo orizonaudio/Sineless`).
# The draft is published by hand, once the zips pass the host protocol in HOSTS.md; see
# "Releasing" in CONTRIBUTING.md. Run by hand, or on a pull request that changes this workflow or
# the packaging scripts, it is a dry run: it builds and checks both zips and keeps them as the
# run's artifacts, but attests nothing and creates no release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package.sh
      - scripts/package.ps1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag names the version CMakeLists.txt builds, so a release is never made from a commit
  # whose version was not bumped (scripts/release-version.ts). A dry run takes the version from
  # CMakeLists.txt alone.
  version:
    name: version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: check
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version="$(node scripts/release-version.ts "$TAG")" || {
            echo "::error::$(node scripts/release-version.ts "$TAG" 2>&1)"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Each zip is built and checked by its packaging script, as by hand: both architectures and the
  # macOS minimum; on Windows, each binary's machine type and no Visual C++ runtime DLLs. Windows
  # builds on ARM64, which runs the x64 build's own steps too (they load the plugin they built).
  macos:
    name: macos
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: build/release/Sineless-${{ needs.version.outputs.version }}-macOS.zip
          if-no-files-found: error

  windows:
    name: windows
    needs: version
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Package
        shell: powershell
        run: scripts/package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: build/release/Sineless-${{ needs.version.outputs.version }}-Windows.zip
          if-no-files-found: error

  # From a tag only: the checksums, the attestation and the draft release.
  release:
    name: release
    if: github.ref_type == 'tag'
    needs: [version, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # The draft release.
      id-token: write # The attestation's signing identity.
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum Sineless-*.zip > SHA256SUMS.txt
          {
            echo '### SHA-256'
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > ../checksums.md
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/Sineless-*.zip
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$TAG" --repo "$REPOSITORY" --draft --verify-tag \
            --title "Sineless $VERSION" --generate-notes --notes-file checksums.md \
            dist/Sineless-*.zip dist/SHA256SUMS.txt
