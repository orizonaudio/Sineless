name: Release

# Pushing a tag vX.Y.Z builds the release zips on GitHub's runners and creates a draft release
# for them, with notes generated from the merged pull requests, a SHA-256 checksum of each zip
# and a build provenance attestation, both in GitHub's attestation store and as a release asset
# (Sineless-<version>.intoto.jsonl), so that a download can be verified from the files alone:
# `gh attestation verify <zip> --repo orizonaudio/Sineless --bundle Sineless-<version>.intoto.jsonl`.
# The draft is published by hand, once the zips pass the host protocol in HOSTS.md; see
# "Releasing" in CONTRIBUTING.md. Run by hand, or on a pull request that changes this workflow or
# the scripts it runs, it is a dry run: it builds and checks both zips and keeps them as the
# run's artifacts, but attests nothing and creates no release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package.sh
      - scripts/package.ps1
      - scripts/windows-env.ps1
      - scripts/release-version.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The tag names the version CMakeLists.txt builds, so a release is never made from a commit
  # whose version was not bumped (scripts/release-version.ts). A dry run takes the version from
  # CMakeLists.txt alone.
  version:
    name: release-version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: check
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version="$(node scripts/release-version.ts "$TAG")" || {
            echo "::error::$(node scripts/release-version.ts "$TAG" 2>&1)"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Each zip is built and checked by its packaging script, as by hand: on macOS both architectures
  # and the minimum macOS; on Windows, x64 (ARM64 is not built for now), the binary's machine type
  # and no Visual C++ runtime DLLs.
  macos:
    name: release-macos
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: scripts/package.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: build/release/Sineless-${{ needs.version.outputs.version }}-macOS.zip
          if-no-files-found: error

  windows:
    name: release-windows
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Package
        shell: powershell
        run: scripts/package.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: build/release/Sineless-${{ needs.version.outputs.version }}-Windows.zip
          if-no-files-found: error

  # From a pushed tag only: the checksums, the attestation and the draft release. Run by hand,
  # even on a tag, it stays a dry run.
  release:
    name: release-draft
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # The draft release.
      id-token: write # The attestation's signing identity.
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          sha256sum Sineless-*.zip > SHA256SUMS.txt
          {
            echo '### SHA-256'
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
            echo
            echo '### Build provenance'
            echo
            echo "Each zip's build is attested by this repository's release workflow. To check a download"
            echo "against it, with the \`Sineless-$VERSION.intoto.jsonl\` asset:"
            echo
            echo '```'
            echo "gh attestation verify Sineless-$VERSION-macOS.zip --repo orizonaudio/Sineless --bundle Sineless-$VERSION.intoto.jsonl"
            echo '```'
          } > ../checksums.md
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/Sineless-*.zip
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # The attestation as an asset too, named as provenance (.intoto.jsonl), which OpenSSF
          # Scorecard's Signed-Releases check looks for.
          cp "$BUNDLE" "dist/Sineless-$VERSION.intoto.jsonl"
          gh release create "$TAG" --repo "$REPOSITORY" --draft --verify-tag \
            --title "Sineless $VERSION" --generate-notes --notes-file checksums.md \
            dist/Sineless-*.zip dist/SHA256SUMS.txt "dist/Sineless-$VERSION.intoto.jsonl"
