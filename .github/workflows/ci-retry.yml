name: CI retry

# A CI run that failed only because some of its jobs never got a runner ("not acquired by Runner
# ... after multiple attempts", which macOS arm64 capacity causes) failed for nothing in the change.
# scripts/ci-retry.ts decides from the run's jobs: a pull request's or main's run has its failed
# jobs rerun, once (only a first attempt is looked at); a merge-queue run gets a comment on its
# pull request, which the session that owns it queues again, since a queue entry this workflow's
# token made would start no CI. A run in which any job ran and failed is left as it is.
#
# workflow_run runs this file as it is on main, for runs of this repository's branches only, and
# it checks out main, never the run's code. Run by hand with a run's id, it decides the same way.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      run:
        description: The id of the CI run to decide on
        required: true

permissions:
  contents: read

jobs:
  retry:
    name: retry
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.run_attempt == 1 &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # Rerunning a run's failed jobs.
      issues: write # The comment on a pull request the merge queue dropped.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id || inputs.run }}
        run: node scripts/ci-retry.ts "$RUN"
