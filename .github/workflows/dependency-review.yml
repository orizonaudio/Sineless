name: Dependency review

# Fails a pull request that adds a dependency with a known vulnerability of moderate severity or
# worse. It also runs, and passes at once, in the merge queue, so that the ruleset can require it.
on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-24.04
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
