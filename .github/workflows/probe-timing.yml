# Temporary: whether Chromium on the macOS runner draws WebGL on its GPU with other launch
# options, and how long the Chromium app tests take then. Not for merging.
name: Probe timing
on:
  pull_request:
    paths: [".github/workflows/probe-timing.yml", ".github/probe/**"]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full-headless
            launch: '{"channel":"chromium"}'
            headful: "0"
          - name: full-headless-metal
            launch: '{"channel":"chromium","args":["--use-angle=metal","--enable-gpu","--ignore-gpu-blocklist"]}'
            headful: "0"
          - name: headful-metal
            launch: '{"args":["--use-angle=metal","--enable-gpu","--ignore-gpu-blocklist"]}'
            headful: "1"
    name: probe (${{ matrix.name }})
    runs-on: macos-15
    timeout-minutes: 60
    env:
      PROBE_LAUNCH: ${{ matrix.launch }}
      PROBE_HEADFUL: ${{ matrix.headful }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: python3 .github/probe/launch.py
      - name: Chromium's WebGL and the worst frame's draw time
        run: |
          cp .github/probe/zz-*.test.ts ui/tests/app/
          npx vitest run --project app --browser=chromium ui/tests/app/zz-gpu-info.test.ts ui/tests/app/zz-gpubench-2.test.ts 2>&1 |
            sed 's/\x1b\[[0-9;]*m//g' | grep -o 'RESULT {[^}]*}\|Error: .*' | head -8 || true
          rm ui/tests/app/zz-*.test.ts
      - name: The playhead test, three times
        run: |
          for round in 1 2 3; do
            (npx vitest run --project app --browser=chromium ui/tests/app/playhead.test.ts 2>&1 |
              sed 's/\x1b\[[0-9;]*m//g' | grep -E '^ +(✓|×)  app|Tests ') || true
          done
      - name: All Chromium app tests
        run: |
          start=$(date +%s)
          (APP_BROWSERS=chromium npx vitest run --project app 2>&1 | sed 's/\x1b\[[0-9;]*m//g' |
            grep -E '^ +×|FAIL|Test Files|Tests ') || true
          echo "== chromium app tests: $(( $(date +%s) - start )) s"
