name: CI

# Every pull request, every merge-queue entry and every push to main runs the same checks; the
# ruleset on main requires the jobs below except "fuzz" and "performance". A change to
# documentation only skips them: a skipped job satisfies the ruleset and the queue, where a job
# that never started would block them. Actions are pinned to commits, so a moved tag cannot
# change what runs.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; every run on main and in the queue finishes
# (each has a group of its own).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Whether the compiler caches are saved: not from the merge queue, whose temporary branches'
  # caches no later run can read (caches are scoped to the branch that saved them); pull requests
  # keep theirs for their next push, and cache-cleanup.yml deletes them when they close.
  SAVE_CACHES: ${{ github.event_name != 'merge_group' }}
  # Each engine mutant's time limit, in seconds (scripts/mutation-cpp.sh, which gives the plugin's
  # and editor's, whose tests take a tenth of a second, a minute): the shares stop a mutant at it,
  # and the merged summary weighs the tests' own time against it, so both read this one value.
  # The engine's tests take about 540 s here with every mutant compiled in, longer with four mutants
  # running at once; a mutant no test notices runs them all, and one stopped at the limit would
  # read as noticed. 1500 s is near three times their time, the margin the summary asks for.
  MUTANT_TIMEOUT: 1500

jobs:
  # Whether anything but documentation changed (scripts/changed-code.ts). Each event is compared
  # with what it builds on: a pull request with its base, a queue entry with the entry before it
  # (whose own run built everything before), a push with the commit before it. Anything that
  # cannot be compared, a run by hand included, counts as code. The jobs below skip only when this
  # job has answered "documentation only"; if it fails, they all run.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            merge_group) range="$QUEUE_BASE..$QUEUE_HEAD" ;;
            push) range="$BEFORE..$AFTER" ;;
            *) range="" ;;
          esac
          code=$(node scripts/changed-code.ts "$range")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" == false ]]; then
            echo "Documentation only; the builds and tests are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  typescript:
    name: typescript
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # The app tests run the real page in WebKit, as WKWebView does on macOS, and Chromium, as
      # WebView2 does on Windows.
      - name: Install the browsers for the app tests
        run: npx playwright install --with-deps webkit chromium
      - run: npm run test:app
      - run: npm run build

  # The C++ format, checked once with a pinned clang-format (the macOS and Windows machines carry
  # different versions), and the shared code's memory checks: the engine, protocol, plugin and
  # editor C++ tests under AddressSanitizer and LeakSanitizer (scripts/check-linux.sh asan). The
  # plugin builds on Linux for the checks alone, without an editor window.
  linux:
    name: linux
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: C++ format (clang-format 23.1.3)
        run: |
          git ls-files -co --exclude-standard -- '*.cpp' '*.h' '*.mm' |
            xargs pipx run --spec clang-format==23.1.3 clang-format --dry-run --Werror
      - name: Install LLVM 23
        run: tools/linux-checks/install-llvm.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci # The editor embeds the page, built with Vite.
      # No compiler cache key may begin another's: the action restores the newest cache whose key
      # starts with this one, so "linux" would also restore linux-tsan's.
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          save: ${{ env.SAVE_CACHES }}
          key: linux-asan # Shared with the lint, which builds the same.
      - run: scripts/check-linux.sh asan

  # The shared code's other checks, each a job of its own, in parallel: the concurrency tests
  # under ThreadSanitizer, the audio thread's tests under RealtimeSanitizer, and clang-tidy
  # (scripts/check-linux.sh). Skipped as a whole, a matrix job reports one check under its
  # unexpanded name, and the required ones never would: its steps are skipped instead.
  linux-checks:
    name: linux-${{ matrix.check }}
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [tsan, rtsan, lint]
    env:
      CODE: ${{ needs.changes.outputs.code != 'false' }}
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - if: env.CODE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.CODE == 'true'
        name: Install LLVM 23
        run: tools/linux-checks/install-llvm.sh
      - if: env.CODE == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.CODE == 'true'
        run: npm ci
      - if: env.CODE == 'true'
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          save: ${{ env.SAVE_CACHES }}
          # The lint builds the AddressSanitizer build, as the linux job does.
          key: linux-${{ matrix.check == 'lint' && 'asan' || matrix.check }}
      - if: env.CODE == 'true'
        run: scripts/check-linux.sh ${{ matrix.check }}

  # Five minutes of fuzzing (libFuzzer, under AddressSanitizer and UndefinedBehaviorSanitizer) of
  # saved-state loading, setting values and the page's messages, within the time the macOS and
  # Windows jobs take anyway, from the corpus kept on main (see fuzz-nightly.yml): each run searches
  # on from the last rather than from the seeds. See "Test levels" in CONTRIBUTING.md. A crash or a
  # failed invariant fails the job and keeps the input as an artifact. Not run in the merge queue,
  # so it does not slow merging: the pull request's run has fuzzed the same code.
  fuzz:
    name: fuzz
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name != 'merge_group' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          save: ${{ env.SAVE_CACHES }}
          key: fuzz
      - run: cmake --preset fuzz -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build --preset fuzz
      # The fuzzers' sources are linted with the rest of the shared code (linux-lint), where they
      # build to replay their inputs.
      # The newest corpus main kept; a pull request reads main's caches but keeps none of its own.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - run: scripts/fuzz.sh 300
      # On main, what the run found joins the kept corpus.
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}-${{ github.run_attempt }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: build/fuzz/artifacts/
          if-no-files-found: ignore

  # scripts/check.sh's main part, on macOS, except the performance limits and the format: build,
  # all C++ tests including the editor's in a real WKWebView, the VST3 validator and pluginval. The
  # TypeScript is the typescript job's; the shared code's sanitizers and lint are Linux's.
  macos:
    name: macos
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-15
    env:
      SKIP_PERFORMANCE: 1
      SKIP_FORMAT: 1
      SKIP_APP_TESTS: 1
      SKIP_TYPESCRIPT: 1
      CHECKS: main
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          save: ${{ env.SAVE_CACHES }}
          key: macos-main # Not "macos", which would also restore macos-glue's (see the linux job).
          max-size: 2G
      - name: Install LLVM
        run: brew install llvm
      - run: npm ci
      - run: scripts/check.sh

  # scripts/check.sh's glue part: the macOS editor's web view tests (WKWebView, Cocoa) under
  # AddressSanitizer and ThreadSanitizer, the Audio Unit's tests under AddressSanitizer and
  # RealtimeSanitizer, and clang-tidy over the macOS sources. In parallel with the main job.
  macos-glue:
    name: macos-glue
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-15
    env:
      SKIP_PERFORMANCE: 1
      SKIP_FORMAT: 1
      SKIP_APP_TESTS: 1
      SKIP_TYPESCRIPT: 1
      CHECKS: glue
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          save: ${{ env.SAVE_CACHES }}
          key: macos-glue
          max-size: 2G
      - name: Install LLVM
        run: brew install llvm
      - run: npm ci
      - run: scripts/check.sh

  # scripts\check.ps1's main part except the performance limit and the format, on x64: build,
  # all C++ tests including the editor's in a real WebView2, the VST3 validator, and pluginval.
  # The TypeScript is the typescript job's. ARM64 is not built for now (the windows-arm64 presets
  # stay, to bring it back).
  windows:
    name: windows-x64
    needs: changes
    # Skipped as a whole, the job would never report the required windows-x64 check: its steps
    # are skipped instead.
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    env:
      PRESETS: windows-x64
      CHECKS: main
      SKIP_PERFORMANCE: 1
      SKIP_FORMAT: 1
      SKIP_APP_TESTS: 1
      SKIP_TYPESCRIPT: 1
      CODE: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - if: env.CODE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.CODE == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.CODE == 'true'
        run: npm ci
      # The images' WebView2 runtime is old and never updated (and leaks handles that the current
      # one does not); users' runtimes update themselves, so the checks run on the current one.
      - if: env.CODE == 'true'
        name: Install the current WebView2 runtime
        shell: powershell
        run: |
          Invoke-WebRequest https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile installwebview.exe
          Start-Process -Wait installwebview.exe -ArgumentList '/silent', '/install'
      - if: env.CODE == 'true'
        name: Run the checks
        shell: powershell
        run: scripts/check.ps1

  # scripts\check.ps1's glue part: the Windows editor's web view tests (WebView2, Win32) under
  # MSVC's AddressSanitizer. In parallel with the main job.
  windows-glue:
    name: windows-x64-glue
    needs: changes
    # Skipped as a whole, the job would never report the required windows-x64-glue check: its
    # steps are skipped instead.
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    env:
      PRESETS: windows-x64
      CHECKS: glue
      SKIP_PERFORMANCE: 1
      SKIP_FORMAT: 1
      SKIP_APP_TESTS: 1
      SKIP_TYPESCRIPT: 1
      CODE: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - if: env.CODE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.CODE == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.CODE == 'true'
        run: npm ci
      # The images' WebView2 runtime is old and never updated (and leaks handles that the current
      # one does not); users' runtimes update themselves, so the checks run on the current one.
      - if: env.CODE == 'true'
        name: Install the current WebView2 runtime
        shell: powershell
        run: |
          Invoke-WebRequest https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile installwebview.exe
          Start-Process -Wait installwebview.exe -ArgumentList '/silent', '/install'
      - if: env.CODE == 'true'
        name: Run the checks
        shell: powershell
        run: scripts/check.ps1

  # Which lines the tests run, in the job summary, with the lines a pull request changes: a
  # report, never a failure, and not a required check. The C++ engine and protocol tests run in a
  # source-based coverage build, the TypeScript unit and app tests (in Chromium) under V8. Not
  # run in the merge queue, so it does not slow merging.
  coverage:
    name: coverage
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name != 'merge_group' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The changed lines are measured against the base branch.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          save: ${{ env.SAVE_CACHES }}
          key: coverage
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cmake --preset coverage -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build --preset coverage
      # Tests failing under coverage are noted in the summary; the other jobs fail on them.
      - name: Measure
        continue-on-error: true
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: scripts/coverage.sh "$BASE"
      - name: Report
        run: |
          cat build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY" ||
            echo "Coverage could not be measured; see the Measure step." >> "$GITHUB_STEP_SUMMARY"

  # Mutation testing of the TypeScript lines a pull request changes (scripts/mutation.sh): a report
  # in the job summary, with warnings on the lines whose changes no unit test notices, and the
  # report for the mutation triage (mutation-triage.yml), which judges each. Never a failure, and
  # not required; pull requests only, as it measures what they change.
  mutation:
    name: mutation
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The changed lines are found against the base branch.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/mutation/package-lock.json
      - name: Measure
        continue-on-error: true
        env:
          BASE: origin/${{ github.base_ref }}
        run: scripts/mutation.sh "$BASE"
      - name: Report
        run: |
          if [[ -f build/mutation/mutation.json ]]; then
            node scripts/mutation-report.ts build/mutation/mutation.json --annotate
          fi
          cat build/mutation/summary.md >> "$GITHUB_STEP_SUMMARY" ||
            echo "Mutation testing did not run; see the Measure step." >> "$GITHUB_STEP_SUMMARY"
      # For the mutation triage (mutation-triage.yml), which judges the mutants no test noticed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-ts
          # With its summary, which says whether nothing was mutated or the run stopped short.
          path: |
            build/mutation/mutation.json
            build/mutation/summary.md
          if-no-files-found: ignore

  # Mutation testing of the engine, plugin and editor lines a pull request changes
  # (scripts/mutation-cpp.sh), with Mull for the runner's Clang 18: a report in the job summary,
  # with warnings on the lines whose changes no test notices. Never a failure, and not required;
  # nothing is built when none of their sources changed. In three steps, so that a large change
  # still gets a report: one job builds the tests with every mutant compiled in and lists the
  # mutants; four share them out, each a quarter of every file; the mutation-cpp job reports their
  # results together, those of mutants not reached in time as not run (a partial report, which
  # the triage never passes). Each mutant runs its own module's tests (engine_tests, plugin_tests
  # or editor_tests) up to their first failure and is stopped at that module's limit if it hangs
  # one (MUTANT_TIMEOUT, set for the whole workflow, for the engine's). The summary says how long
  # each module's tests take unmutated, and warns when that is more than half its limit, as a
  # mutant no test notices would then be reported as timed out. No share starts a mutant after 50
  # minutes of running them (MUTATION_DEADLINE): with the engine's limit of 25 and the setup and
  # one unmutated run of the tests before them, the job's 90 rarely end it; when they do, the
  # results it wrote are kept and the rest reported as not run.
  mutation-cpp-list:
    name: mutation-cpp-list
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      mutants: ${{ steps.list.outputs.mutants }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The changed lines are found against the base branch.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci # The editor embeds the page, built with Vite.
      - run: sudo tools/mutation/install-mull.sh
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          save: ${{ env.SAVE_CACHES }}
          key: mutation-cpp
      - name: Build and list the mutants
        id: list
        continue-on-error: true # A report, never a failure: the triage says when none was made.
        env:
          BASE: origin/${{ github.base_ref }}
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: |
          scripts/mutation-cpp.sh --list "$BASE"
          report=build/mutation-cpp-report/dry.json
          echo "mutants=$([[ -f $report ]] && jq '[.files[].mutants[]] | length' $report || echo 0)" \
            >> "$GITHUB_OUTPUT"
      # The list (with each module's Mull log, for its tests' time) or the summary saying no C++
      # source line changed, and the tests to run the mutants with. Not named mutation-*: the
      # triage takes only the reports.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpp-mutants-list
          path: build/mutation-cpp-report/
          retention-days: 1
      - if: steps.list.outputs.mutants != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpp-mutants-tests
          path: |
            build/mutation-cpp/bin/RelWithDebInfo/engine_tests
            build/mutation-cpp/bin/RelWithDebInfo/plugin_tests
            build/mutation-cpp/bin/RelWithDebInfo/editor_tests
          retention-days: 1

  mutation-cpp-share:
    name: mutation-cpp-share-${{ matrix.share }}
    needs: mutation-cpp-list
    if: ${{ !cancelled() && needs.mutation-cpp-list.outputs.mutants != '0' && needs.mutation-cpp-list.outputs.mutants != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        share: [1, 2, 3, 4]
    steps:
      # At the list job's workspace path: the tests find their data by the source paths compiled
      # in.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cpp-mutants-list
          path: build/mutation-cpp-report
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cpp-mutants-tests
          path: build/mutation-cpp/bin/RelWithDebInfo
      - name: Run the share's mutants
        continue-on-error: true # Its mutants are then reported as not run.
        env:
          MUTATION_DEADLINE: 3000
        run: |
          chmod +x build/mutation-cpp/bin/RelWithDebInfo/*_tests # Artifacts keep no permissions.
          scripts/mutation-cpp.sh --share "${{ matrix.share }}/4"
      # Each result is written as it is known: whatever this job managed is kept, even if it fails.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpp-mutants-results-${{ matrix.share }}
          path: build/mutation-cpp-report/results-*.jsonl
          retention-days: 1
          if-no-files-found: ignore

  mutation-cpp:
    name: mutation-cpp
    needs: [mutation-cpp-list, mutation-cpp-share]
    if: ${{ !cancelled() && needs.mutation-cpp-list.result != 'skipped' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: cpp-mutants-list
          path: build/mutation-cpp-report
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: cpp-mutants-results-*
          path: build/mutation-cpp-report
          merge-multiple: true
      - name: Measure
        continue-on-error: true
        run: |
          if [[ -f build/mutation-cpp-report/dry.json ]]; then
            scripts/mutation-cpp.sh --merge > /dev/null
          fi
      - name: Report
        run: |
          if [[ -f build/mutation-cpp-report/mull.json ]]; then
            node scripts/mutation-report.ts build/mutation-cpp-report/mull.json --annotate
          fi
          cat build/mutation-cpp-report/summary.md >> "$GITHUB_STEP_SUMMARY" ||
            echo "Mutation testing did not run; see the mutation-cpp-list job." >> "$GITHUB_STEP_SUMMARY"
      # For the mutation triage (mutation-triage.yml), which judges the mutants no test noticed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-cpp
          # With its summary, which says whether nothing was mutated or some mutants were not run.
          path: |
            build/mutation-cpp-report/mull.json
            build/mutation-cpp-report/summary.md
          if-no-files-found: ignore

  # The performance limits (scripts/performance.sh): the leak limits (what reopening the editor
  # leaves behind) warn when missed; the speed limits, set for a developer's Mac, are measured and
  # shown in the job summary without being judged, as these shared machines missed them on every
  # run. Never a failure, and not run in the merge queue, so it does not slow merging.
  performance:
    name: performance-${{ matrix.os }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name != 'merge_group' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-15
          - os: windows
            runner: windows-2022
    env:
      PERF_SPEED: report
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: macos
        if: matrix.os == 'macos'
        continue-on-error: true
        shell: bash # With pipefail, so that the script's failure is the step's through tee.
        run: scripts/performance.sh 2>&1 | tee performance.log
      - id: windows
        if: matrix.os == 'windows'
        continue-on-error: true
        shell: powershell
        env:
          PERF_LOG: performance.log # Not a pipe: see scripts/performance.ps1.
        run: scripts/performance.ps1
      - if: steps.macos.outcome == 'failure' || steps.windows.outcome == 'failure'
        run: echo "::warning title=Performance::A leak limit was missed on ${{ matrix.os }}, or a benchmark did not run to the end; see the log of the step above."
      # The measurements, to compare between runs, from each platform's log.
      - if: always()
        shell: pwsh
        run: |
          # No log at all (the benchmarks did not build or run) is reported, not an error.
          $lines = @(Select-String -Path performance.log -ErrorAction SilentlyContinue `
            -Pattern '^(limit|total|page|reopen|reopened|worst share|  thread Sineless analysis)' |
            ForEach-Object { $_.Line })
          if ($lines.Count -eq 0) { $lines = @('No measurements; see the log.') }
          @("## Performance (${{ matrix.os }})", '', '```') + $lines + @('```') |
            Add-Content -Path $env:GITHUB_STEP_SUMMARY
