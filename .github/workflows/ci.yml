name: CI

# Manual only while the repository is private: macOS runner minutes count tenfold against
# the free allowance. Run it from the Actions tab.
on:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install LLVM
        run: brew install llvm
      - name: Install npm dependencies
        run: npm ci
      - name: Run all checks
        run: scripts/check.sh
