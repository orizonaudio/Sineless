name: CI

# Every pull request, every merge-queue entry and every push to main runs the same checks; the
# ruleset on main requires the jobs below except "fuzz" and "performance". A change to
# documentation only skips them: a skipped job satisfies the ruleset and the queue, where a job
# that never started would block them. Actions are pinned to commits, so a moved tag cannot
# change what runs.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels its older run; every run on main and in the queue finishes
# (each has a group of its own).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether anything but documentation changed (scripts/changed-code.ts). Each event is compared
  # with what it builds on: a pull request with its base, a queue entry with the entry before it
  # (whose own run built everything before), a push with the commit before it. Anything that
  # cannot be compared, a run by hand included, counts as code. The jobs below skip only when this
  # job has answered "documentation only"; if it fails, they all run.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          QUEUE_HEAD: ${{ github.event.merge_group.head_sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE...$PR_HEAD" ;;
            merge_group) range="$QUEUE_BASE..$QUEUE_HEAD" ;;
            push) range="$BEFORE..$AFTER" ;;
            *) range="" ;;
          esac
          code=$(node scripts/changed-code.ts "$range")
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [[ "$code" == false ]]; then
            echo "Documentation only; the builds and tests are skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  typescript:
    name: typescript
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # The app tests run the real page in WebKit, as WKWebView does on macOS, and Chromium, as
      # WebView2 does on Windows.
      - name: Install the browsers for the app tests
        run: npx playwright install --with-deps webkit chromium
      - run: npm run test:app
      - run: npm run build

  # The C++ format, checked once with a pinned clang-format (the macOS and Windows machines carry
  # different versions), and the engine and protocol C++ tests under AddressSanitizer, without
  # the VST3 SDK: the fast signal, and the tier contributors without a Mac or Windows can run.
  linux:
    name: linux
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: C++ format (clang-format 23.1.3)
        run: |
          git ls-files -co --exclude-standard -- '*.cpp' '*.h' '*.mm' |
            xargs pipx run --spec clang-format==23.1.3 clang-format --dry-run --Werror
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: linux
      - run: cmake --preset linux -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build --preset linux
      - run: ctest --preset linux -j "$(nproc)"

  # A minute of fuzzing (libFuzzer, under AddressSanitizer and UndefinedBehaviorSanitizer) of
  # saved-state loading, setting values and the page's messages; see "Test levels" in
  # CONTRIBUTING.md. A crash or a failed invariant fails the job and keeps the input as an
  # artifact. Not run in the merge queue, so it does not slow merging: the pull request's run has
  # fuzzed the same code, and another minute of random inputs there would find little more.
  fuzz:
    name: fuzz
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name != 'merge_group' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: fuzz
      - run: cmake --preset fuzz -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build --preset fuzz
      # The macOS job lints the rest of the C++; the fuzzers build only here.
      - name: C++ lint of the fuzzers (clang-tidy 22.1.8)
        run: pipx run --spec clang-tidy==22.1.8 clang-tidy -p build/fuzz --quiet engine/tests/fuzz/*.cpp
      - run: scripts/fuzz.sh 60
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: build/fuzz/artifacts/
          if-no-files-found: ignore

  # Everything scripts/check.sh checks except the performance limits and the format: build, all C++
  # tests including the editor's in a real WKWebView, the VST3 validator, clang-tidy, the
  # RealtimeSanitizer, ThreadSanitizer and AddressSanitizer builds and pluginval. The TypeScript is
  # the typescript job's.
  macos:
    name: macos
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-15
    env:
      SKIP_PERFORMANCE: 1
      SKIP_FORMAT: 1
      SKIP_APP_TESTS: 1
      SKIP_TYPESCRIPT: 1
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: macos
          max-size: 2G
      - name: Install LLVM
        run: brew install llvm
      - run: npm ci
      - run: scripts/check.sh

  # Everything scripts\check.ps1 checks except the performance limit and the format, on x64:
  # build, all C++ tests including the editor's in a real WebView2, the VST3 validator, and
  # pluginval. The TypeScript is the typescript job's. ARM64 is not built for now (the
  # windows-arm64 presets stay, to bring it back).
  windows:
    name: windows-x64
    needs: changes
    # Skipped as a whole, the job would never report the required windows-x64 check: its steps
    # are skipped instead.
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    env:
      PRESETS: windows-x64
      SKIP_PERFORMANCE: 1
      SKIP_FORMAT: 1
      SKIP_APP_TESTS: 1
      SKIP_TYPESCRIPT: 1
      CODE: ${{ needs.changes.outputs.code != 'false' }}
    steps:
      - if: env.CODE == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.CODE == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: env.CODE == 'true'
        run: npm ci
      # The images' WebView2 runtime is old and never updated (and leaks handles that the current
      # one does not); users' runtimes update themselves, so the checks run on the current one.
      - if: env.CODE == 'true'
        name: Install the current WebView2 runtime
        shell: powershell
        run: |
          Invoke-WebRequest https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile installwebview.exe
          Start-Process -Wait installwebview.exe -ArgumentList '/silent', '/install'
      - if: env.CODE == 'true'
        name: Run the checks
        shell: powershell
        run: scripts/check.ps1

  # Which lines the tests run, in the job summary, with the lines a pull request changes: a
  # report, never a failure, and not a required check. The C++ engine and protocol tests run in a
  # source-based coverage build, the TypeScript unit and app tests (in Chromium) under V8. Not
  # run in the merge queue, so it does not slow merging.
  coverage:
    name: coverage
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name != 'merge_group' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The changed lines are measured against the base branch.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: coverage
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: cmake --preset coverage -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: cmake --build --preset coverage
      # Tests failing under coverage are noted in the summary; the other jobs fail on them.
      - name: Measure
        continue-on-error: true
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: scripts/coverage.sh "$BASE"
      - name: Report
        run: |
          cat build/coverage/summary.md >> "$GITHUB_STEP_SUMMARY" ||
            echo "Coverage could not be measured; see the Measure step." >> "$GITHUB_STEP_SUMMARY"

  # Mutation testing of the TypeScript lines a pull request changes (scripts/mutation.sh): a report
  # in the job summary, with warnings on the lines whose changes no unit test notices. Never a
  # failure, and not required; pull requests only, as it measures what they change.
  mutation:
    name: mutation
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The changed lines are found against the base branch.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tools/mutation/package-lock.json
      - name: Measure
        continue-on-error: true
        env:
          BASE: origin/${{ github.base_ref }}
        run: scripts/mutation.sh "$BASE"
      - name: Report
        run: |
          if [[ -f build/mutation/mutation.json ]]; then
            node scripts/mutation-report.ts build/mutation/mutation.json --annotate
          fi
          cat build/mutation/summary.md >> "$GITHUB_STEP_SUMMARY" ||
            echo "Mutation testing did not run; see the Measure step." >> "$GITHUB_STEP_SUMMARY"

  # Mutation testing of the engine lines a pull request changes (scripts/mutation-cpp.sh), with
  # Mull for the runner's Clang 18: a report in the job summary, with warnings on the lines whose
  # changes no engine test notices. Never a failure, and not required; nothing is built when no
  # engine source changed. Each mutant runs the tests up to their first failure: about 100 s at
  # most, or 300 s for one that hangs a test, on every core. The script stops a run at 75 minutes,
  # within the job's 90.
  mutation-cpp:
    name: mutation-cpp
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The changed lines are found against the base branch.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: sudo tools/mutation/install-mull.sh
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: mutation-cpp
      - name: Measure
        continue-on-error: true
        env:
          BASE: origin/${{ github.base_ref }}
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: scripts/mutation-cpp.sh "$BASE"
      - name: Report
        run: |
          if [[ -f build/mutation-cpp-report/mull.json ]]; then
            node scripts/mutation-report.ts build/mutation-cpp-report/mull.json --annotate
          fi
          cat build/mutation-cpp-report/summary.md >> "$GITHUB_STEP_SUMMARY" ||
            echo "Mutation testing did not run; see the Measure step." >> "$GITHUB_STEP_SUMMARY"

  # The performance limits, reported as a warning, never a failure: shared CI machines are too
  # noisy for hard limits, so they are a little looser here than on a developer's Mac. Not run in
  # the merge queue, so it does not slow merging.
  performance:
    name: performance-${{ matrix.os }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name != 'merge_group' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-15
          - os: windows
            runner: windows-2022
    env:
      PERF_MIN_FPS: 40
      PERF_CPU_SLACK: 10
      PERF_MAX_SHARE: 0.06
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - id: macos
        if: matrix.os == 'macos'
        continue-on-error: true
        run: scripts/performance.sh
      - id: windows
        if: matrix.os == 'windows'
        continue-on-error: true
        shell: powershell
        run: scripts/performance.ps1
      - if: steps.macos.outcome == 'failure' || steps.windows.outcome == 'failure'
        run: echo "::warning title=Performance::A performance limit was missed on ${{ matrix.os }}; see the log of the step above."
